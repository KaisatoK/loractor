[project]
name = "ai-chatbot-test"
version = "0.1.0"
description = "Role-aware log-investigation chatbot (Streamlit UI + FastAPI/LangGraph backend)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.142.2",
    "langchain==1.4.3",
    "langchain-deepseek==1.1.1",
    "langchain-google-genai==4.4.0",
    "langchain-groq==1.1.3",
    "langchain-serenedb>=26.9.3",
    "langchain-typesafe==0.0.1a3",
    "langgraph==1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pandas==3.0.6",
    "psycopg2==2.9.13",
    "pyperclip==1.11.0",
    "python-dotenv==1.1.1",
    "requests==2.34.2",
    "streamlit==1.65.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend", "src/ui"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
