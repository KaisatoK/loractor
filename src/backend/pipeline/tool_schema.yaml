tool_catalog:
  name: "log_database_tools"
  description: >
    Tools for querying application logs. All timestamps must use
    YYYY-MM-DD HH:MM:SS format unless otherwise specified.

  shared_types:
    TableName:
      type: string
      enum:
        - log
      default: log
      description: >
        Database table containing log records. Currently only "log"
        is supported.

    LogCategory:
      type: string
      enum:
        - INFO
        - WARNING
        - ERROR
      nullable: true
      description: >
        Exact log severity. When omitted or null, results may include
        all severities.

    Timestamp:
      type: string
      format: datetime
      pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$'
      example: "2026-10-07 09:00:00"
      description: >
        Timestamp in YYYY-MM-DD HH:MM:SS format.

  usage_rules:
    - Use only the tools defined in this catalog.
    - Do not invent process IDs, timestamps, categories, table names, or limits.
    - A PID must come directly from the user or previously collected evidence.
    - Time-window boundaries are inclusive.
    - Put severity values in the category argument, never in query_text.
    - A failed tool call means evidence is unavailable.
    - Use not_found only when a successful tool call returns no matching rows.
    - Never fabricate database results.
    - The only supported table_name value is "log".
    - Omit optional arguments when no valid value is known.
    - Do not pass null unless the tool-calling interface requires explicit nulls.

  tools:
    - name: count_logs_by_severity
      description: >
        Count log rows by exact severity within an inclusive time window.
        If category is omitted, count logs across all severities.
      operation: "count logs by severity"

      input_schema:
        type: object
        additionalProperties: false
        required:
          - start_time
          - end_time
        properties:
          start_time:
            $ref: "#/tool_catalog/shared_types/Timestamp"

          end_time:
            $ref: "#/tool_catalog/shared_types/Timestamp"

          table_name:
            $ref: "#/tool_catalog/shared_types/TableName"

          category:
            $ref: "#/tool_catalog/shared_types/LogCategory"

      output_schema:
        type: object
        required:
          - status
          - operation
          - data
        properties:
          status:
            type: string
            const: success

          operation:
            type: string
            const: "count logs by severity"

          data:
            description: >
              Result returned by the count_by_category database function.
            type:
              - object
              - array
              - integer
              - "null"

      examples:
        - purpose: "Count ERROR logs during an incident window"
          arguments:
            start_time: "2026-10-07 09:00:00"
            end_time: "2026-10-07 10:00:00"
            table_name: log
            category: ERROR

        - purpose: "Count logs of all severities"
          arguments:
            start_time: "2026-10-07 09:00:00"
            end_time: "2026-10-07 10:00:00"
            table_name: log

    - name: get_pid_log_trend
      description: >
        Count logs per minute for one known process ID within an inclusive
        time window. Optionally restrict the result to one exact severity.
      operation: "get PID log trend"

      input_schema:
        type: object
        additionalProperties: false
        required:
          - start_time
          - end_time
          - pid
        properties:
          start_time:
            $ref: "#/tool_catalog/shared_types/Timestamp"

          end_time:
            $ref: "#/tool_catalog/shared_types/Timestamp"

          pid:
            type: integer
            minimum: 0
            description: >
              Exact process ID. The value must come from the user or from
              previously collected evidence.

          table_name:
            $ref: "#/tool_catalog/shared_types/TableName"

          category:
            $ref: "#/tool_catalog/shared_types/LogCategory"

      output_schema:
        type: object
        required:
          - status
          - operation
          - data
        properties:
          status:
            type: string
            const: success

          operation:
            type: string
            const: "get PID log trend"

          data:
            description: >
              Per-minute log counts returned by the
              get_trend_by_category database function.
            type:
              - object
              - array
              - "null"

      examples:
        - purpose: "Get the ERROR-log trend for a known PID"
          arguments:
            start_time: "2026-10-07 09:00:00"
            end_time: "2026-10-07 10:00:00"
            pid: 4127
            table_name: log
            category: ERROR

    - name: search_log_messages
      description: >
        Search log-message content. query_text contains only message text
        or a concept. Severity must be supplied separately through category.
      operation: "search log messages"

      input_schema:
        type: object
        additionalProperties: false
        required:
          - query_text
        properties:
          query_text:
            type: string
            minLength: 1
            maxLength: 500
            description: >
              Text or concept to search for in log messages. Do not include
              INFO, WARNING, or ERROR merely as severity filters.

          category:
            $ref: "#/tool_catalog/shared_types/LogCategory"

          table_name:
            $ref: "#/tool_catalog/shared_types/TableName"

          limit:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
            description: Maximum number of matching rows to return.

      output_schema:
        type: object
        required:
          - status
          - operation
          - data
        properties:
          status:
            type: string
            const: success

          operation:
            type: string
            const: "search log messages"

          data:
            description: >
              Matching log entries returned by the search_logs database
              function.
            type:
              - object
              - array
              - "null"

      examples:
        - purpose: "Search ERROR messages related to connection timeouts"
          arguments:
            query_text: "connection timeout"
            category: ERROR
            table_name: log
            limit: 20

        - purpose: "Search messages without a severity restriction"
          arguments:
            query_text: "database connection refused"
            table_name: log
            limit: 10

      invalid_examples:
        - reason: >
            Severity must be placed in category, not embedded in query_text.
          arguments:
            query_text: "ERROR connection timeout"
            table_name: log

    - name: rank_services_by_log_volume
      description: >
        Rank services or components by log volume within an inclusive time
        window. Optionally restrict the ranking to one exact severity.
      operation: "rank services by log volume"

      input_schema:
        type: object
        additionalProperties: false
        required:
          - start_time
          - end_time
        properties:
          start_time:
            $ref: "#/tool_catalog/shared_types/Timestamp"

          end_time:
            $ref: "#/tool_catalog/shared_types/Timestamp"

          table_name:
            $ref: "#/tool_catalog/shared_types/TableName"

          category:
            $ref: "#/tool_catalog/shared_types/LogCategory"

          limit:
            type: integer
            minimum: 1
            maximum: 100
            default: 5
            description: Maximum number of ranked services or components.

      output_schema:
        type: object
        required:
          - status
          - operation
          - data
        properties:
          status:
            type: string
            const: success

          operation:
            type: string
            const: "rank services by log volume"

          data:
            description: >
              Ranked service or component counts returned by the
              top_in_category_by_service database function.
            type:
              - object
              - array
              - "null"

      examples:
        - purpose: "Find services producing the most ERROR logs"
          arguments:
            start_time: "2026-10-07 09:00:00"
            end_time: "2026-10-07 10:00:00"
            table_name: log
            category: ERROR
            limit: 5

    - name: compare_log_periods
      description: >
        Compare component and severity counts between an inclusive baseline
        period and an inclusive recent period.
      operation: "compare log periods"

      input_schema:
        type: object
        additionalProperties: false
        required:
          - baseline_start
          - baseline_end
          - recent_start
          - recent_end
        properties:
          baseline_start:
            allOf:
              - $ref: "#/tool_catalog/shared_types/Timestamp"
            description: Inclusive baseline-period start timestamp.

          baseline_end:
            allOf:
              - $ref: "#/tool_catalog/shared_types/Timestamp"
            description: Inclusive baseline-period end timestamp.

          recent_start:
            allOf:
              - $ref: "#/tool_catalog/shared_types/Timestamp"
            description: Inclusive recent-period start timestamp.

          recent_end:
            allOf:
              - $ref: "#/tool_catalog/shared_types/Timestamp"
            description: Inclusive recent-period end timestamp.

          table_name:
            $ref: "#/tool_catalog/shared_types/TableName"

          limit:
            type: integer
            minimum: 1
            maximum: 100
            default: 5
            description: >
              Maximum number of component and severity changes to return.

      output_schema:
        type: object
        required:
          - status
          - operation
          - data
        properties:
          status:
            type: string
            const: success

          operation:
            type: string
            const: "compare log periods"

          data:
            description: >
              Component and severity count changes returned by the
              compare_periods database function.
            type:
              - object
              - array
              - "null"

      examples:
        - purpose: "Compare a recent incident window with a baseline window"
          arguments:
            baseline_start: "2026-10-06 09:00:00"
            baseline_end: "2026-10-06 10:00:00"
            recent_start: "2026-10-07 09:00:00"
            recent_end: "2026-10-07 10:00:00"
            table_name: log
            limit: 10

  failure_contract:
    description: >
      Tool exceptions are converted into a ToolMessage instead of a
      successful structured result.

    message_template: >
      The tool could not complete the database operation: {error}
      Do not infer or fabricate a result.

    interpretation:
      status: unavailable
      rules:
        - Do not interpret a failed call as an empty result.
        - Do not mark failed evidence as not_found.
        - Do not retry with invented or guessed arguments.
        - Explain which evidence could not be collected.

  evidence_status_rules:
    supports: >
      A successful tool call returned a fact matching the evidence
      requirement.

    contradicts: >
      A successful tool call returned a fact that directly conflicts with
      the evidence requirement.

    not_found: >
      A successful tool call completed but returned no matching fact.

    unavailable: >
      The tool failed, required arguments are unknown, or no available tool
      can verify the evidence requirement.

  tool_selection_guide:
    - intent: "Count logs in a time window"
      use: count_logs_by_severity

    - intent: "Inspect a known process ID over time"
      use: get_pid_log_trend

    - intent: "Find messages containing